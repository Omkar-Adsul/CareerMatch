<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - CareerMatch</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #1f2937;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: white;
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .skill {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            background: #fafafa;
        }

        .skill input {
            width: auto;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .flash {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
        }

        @media (max-width: 700px) {

            .container {
                width: 90%;
            }

            .skills {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>CareerMatch</h2>

        <div>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('profile') }}">My Profile</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>My Profile</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="flash">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">


                <!-- EDUCATION -->

                <div class="form-group">

                    <label for="education">
                        Education
                    </label>

                    <input
                        type="text"
                        id="education"
                        name="education"
                        placeholder="Example: B.Sc. Computer Science"
                        value="{{ profile[0] if profile and profile[0] else '' }}"
                    >

                </div>


                <!-- DEGREE -->

                <div class="form-group">

                    <label for="degree">
                        Degree
                    </label>

                    <input
                        type="text"
                        id="degree"
                        name="degree"
                        placeholder="Example: B.Sc. CS"
                        value="{{ profile[1] if profile and profile[1] else '' }}"
                    >

                </div>


                <!-- GRADUATION YEAR -->

                <div class="form-group">

                    <label for="graduation_year">
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        id="graduation_year"
                        name="graduation_year"
                        placeholder="Example: 2027"
                        value="{{ profile[2] if profile and profile[2] else '' }}"
                    >

                </div>


                <!-- EXPERIENCE -->

                <div class="form-group">

                    <label for="experience">
                        Experience (Years)
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        min="0"
                        id="experience"
                        name="experience"
                        placeholder="Example: 1.5"
                        value="{{ profile[3] if profile and profile[3] is not none else '' }}"
                    >

                </div>


                <!-- PREFERRED ROLE -->

                <div class="form-group">

                    <label for="preferred_role">
                        Preferred Job Role
                    </label>

                    <select
                        id="preferred_role"
                        name="preferred_role"
                    >

                        <option value="">
                            Select preferred role
                        </option>

                        <option value="Software Developer"
                            {% if profile and profile[4] == "Software Developer" %}selected{% endif %}>
                            Software Developer
                        </option>

                        <option value="Web Developer"
                            {% if profile and profile[4] == "Web Developer" %}selected{% endif %}>
                            Web Developer
                        </option>

                        <option value="Data Analyst"
                            {% if profile and profile[4] == "Data Analyst" %}selected{% endif %}>
                            Data Analyst
                        </option>

                        <option value="Data Scientist"
                            {% if profile and profile[4] == "Data Scientist" %}selected{% endif %}>
                            Data Scientist
                        </option>

                        <option value="Python Developer"
                            {% if profile and profile[4] == "Python Developer" %}selected{% endif %}>
                            Python Developer
                        </option>

                        <option value="Java Developer"
                            {% if profile and profile[4] == "Java Developer" %}selected{% endif %}>
                            Java Developer
                        </option>

                        <option value="Cloud Engineer"
                            {% if profile and profile[4] == "Cloud Engineer" %}selected{% endif %}>
                            Cloud Engineer
                        </option>

                    </select>

                </div>


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="preferred_location">
                        Preferred Location
                    </label>

                    <input
                        type="text"
                        id="preferred_location"
                        name="preferred_location"
                        placeholder="Example: Pune"
                        value="{{ profile[5] if profile and profile[5] else '' }}"
                    >

                </div>


                <!-- BIO -->

                <div class="form-group">

                    <label for="bio">
                        About You
                    </label>

                    <textarea
                        id="bio"
                        name="bio"
                        placeholder="Write a short description about yourself..."
                    >{{ profile[6] if profile and profile[6] else '' }}</textarea>

                </div>


                <!-- SKILLS -->

                <div class="form-group">

                    <label>
                        Skills
                    </label>

                    <div class="skills">

                        {% for skill in skills %}

                            <label class="skill">

                                <input
                                    type="checkbox"
                                    name="skills"
                                    value="{{ skill[0] }}"
                                    {% if skill[0] in selected_skills %}checked{% endif %}
                                >

                                {{ skill[1] }}

                            </label>

                        {% endfor %}

                    </div>

                </div>


                <button type="submit">
                    Save Profile
                </button>

            </form>

        </div>

    </div>

</body>

</html>
